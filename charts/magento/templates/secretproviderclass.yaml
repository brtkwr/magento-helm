{{- if .Values.secretProviderClass.create }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretProviderClass.name | default (include "magento.fullname" .) }}
  labels:
    {{- include "magento.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretProviderClass.provider | default "gcp" }}
  parameters:
    secrets: |-
      {{- toYaml .Values.secretProviderClass.secrets | nindent 6 }}
  {{- with .Values.secretProviderClass.secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
