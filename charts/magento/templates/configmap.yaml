apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "magento.fullname" . }}-setup
  labels:
    {{- include "magento.labels" . | nindent 4 }}
data:
  # init-setup.sh runs in init container (blocking) - core Magento setup
  init-setup.sh: |
    #!/bin/bash
    set -e

    cd /var/www/html

    # Run bin/magento commands as www-data to ensure correct file ownership
    mage() {
      runuser -u www-data -- bin/magento "$@"
    }

    fix_permissions() {
      echo "Fixing permissions..."
      chown -R www-data:www-data var/ generated/ pub/static/ pub/media/ app/etc/ plugins/ 2>/dev/null || true
      chmod -R 775 var/ generated/ 2>/dev/null || true
    }

    {{- if .Values.gitSync.plugins }}
    # Materialise git-sync plugins to a stable, non-rotating path.
    #
    # PHP's __DIR__ resolves through symlinks at include time, so registering
    # a module via a symlink that targets git-sync's SHA-named worktree
    # (.worktrees/<sha>/) bakes the SHA into Magento's config cache and
    # compiled DI metadata. When git-sync rotates and prunes the old
    # worktree, every cached path 500s with "module.xml file can't be read".
    #
    # Fix: rsync the worktree contents into /var/www/html/plugins/<name>/
    # (a real directory whose path never changes) and point app/code/...
    # at that. realpath() now resolves to the stable path; rotations only
    # need to refresh contents, not paths.
    echo "Materialising git-sync plugins to stable paths..."
    mkdir -p /var/www/html/plugins
    {{- range .Values.gitSync.plugins }}
    mkdir -p /var/www/html/plugins/{{ .name }}
    rsync -aL --delete /var/www/html/git-sync/{{ .name }}/code/ /var/www/html/plugins/{{ .name }}/
    mkdir -p $(dirname /var/www/html/{{ .path }})
    rm -rf /var/www/html/{{ .path }}
    ln -sf /var/www/html/plugins/{{ .name }} /var/www/html/{{ .path }}
    echo "Symlink: {{ .path }} -> /var/www/html/plugins/{{ .name }}"
    {{- end }}

    # Seed git-sync markers immediately after symlinks land. Captures the
    # SHA before init-setup compiles DI and before postSetup runs its long
    # npm/build/config:set steps — so any sidecar-driven flip during those
    # phases is caught by the watcher's first poll instead of being silently
    # adopted as "no change".
    for link in /var/www/html/git-sync/*/code; do
      [ -L "$link" ] || continue
      name=$(basename "$(dirname "$link")")
      current=$(readlink -f "$link" 2>/dev/null || true)
      [ -n "$current" ] || continue
      echo "$current" > "/var/www/html/var/.gitsync-${name}-head"
      echo "git-sync marker seeded for ${name}: ${current}"
    done
    {{- end }}

    # Wait for database (sidecar should be ready)
    echo "Waiting for database..."
    for i in $(seq 1 60); do
      if mysql -h 127.0.0.1 -u {{ .Values.database.user }} -p"$MYSQL_PASSWORD" --skip-ssl -e "SELECT 1" &>/dev/null; then
        echo "Database is ready"
        break
      fi
      if [ $i -eq 60 ]; then
        echo "ERROR: Database not ready after 60 attempts"
        exit 1
      fi
      sleep 2
    done

    {{- if .Values.opensearch.enabled }}
    # Wait for OpenSearch (sidecar should be ready)
    echo "Waiting for OpenSearch..."
    for i in $(seq 1 60); do
      if curl -s http://127.0.0.1:9200/_cluster/health &>/dev/null; then
        echo "OpenSearch is ready"
        break
      fi
      if [ $i -eq 60 ]; then
        echo "ERROR: OpenSearch not ready after 60 attempts"
        exit 1
      fi
      sleep 2
    done
    {{- end }}

    # Restore sample-data-media if missing (idempotent via cp -n).
    # Runs for both install and upgrade paths so PVCs that lost their media
    # (or were created before this copy block existed) can recover without a
    # manual intervention. If the catalog was empty before the copy, flag a
    # marker so postStart runs catalog:images:resize to populate the cache.
    if [ -d /var/www/html/vendor/magento/sample-data-media/catalog ]; then
      CATALOG_BEFORE=$(find /var/www/html/pub/media/catalog/product -type f 2>/dev/null | head -1)
      cp -rn /var/www/html/vendor/magento/sample-data-media/* /var/www/html/pub/media/
      chown -R www-data:www-data /var/www/html/pub/media/
      CATALOG_AFTER=$(find /var/www/html/pub/media/catalog/product -type f 2>/dev/null | head -1)
      if [ -z "$CATALOG_BEFORE" ] && [ -n "$CATALOG_AFTER" ]; then
        echo "Sample data media restored from image — flagging catalog resize"
        touch /var/www/html/var/.needs-catalog-resize
      fi
    fi

    # Restore the sample-data CMS stylesheet. Ships with module-cms-sample-data
    # and is referenced by the 'design/head/includes' core_config_data row
    # (value: <link ... href="{{ "{{" }}MEDIA_URL}}styles.css" />). Contains the
    # .block-promo.* rules that style
    # the Luma homepage CMS grid. The fresh-install fixture loader drops it
    # into pub/media/, but nothing restores it on upgrade if the PVC loses it.
    if [ -f /var/www/html/vendor/magento/module-cms-sample-data/fixtures/styles.css ] \
       && [ ! -f /var/www/html/pub/media/styles.css ]; then
      cp /var/www/html/vendor/magento/module-cms-sample-data/fixtures/styles.css \
         /var/www/html/pub/media/styles.css
      chown www-data:www-data /var/www/html/pub/media/styles.css
      echo "Sample data styles.css restored to pub/media/"
    fi

    # Check if Magento is already installed
    if [ -f app/etc/env.php ]; then
      echo "=== UPGRADE PATH ==="

      # Backup env.php before upgrade
      cp app/etc/env.php app/etc/env.php.bak

      echo "Running setup:upgrade..."
      mage setup:upgrade || {
        echo "setup:upgrade failed, restoring env.php backup"
        cp app/etc/env.php.bak app/etc/env.php
        exit 1
      }

      # Clean generated code
      rm -rf generated/code generated/metadata

      echo "Running setup:di:compile..."
      mage setup:di:compile || {
        echo "setup:di:compile failed, restoring env.php backup"
        cp app/etc/env.php.bak app/etc/env.php
        exit 1
      }

      # Validate env.php has install date
      php -r "
        \$c = include 'app/etc/env.php';
        if (!isset(\$c['install']['date'])) {
          \$c['install'] = ['date' => date('r')];
          file_put_contents('app/etc/env.php', '<?php return '.var_export(\$c,true).';');
          echo \"Fixed missing install date in env.php\n\";
        }
      "

      # Disable 2FA modules on every upgrade too — sample-data fixtures or
      # a setup:upgrade from a vendor version where they were enabled can
      # otherwise lock admins out after an upgrade.
      mage module:disable Magento_AdminAdobeImsTwoFactorAuth Magento_TwoFactorAuth || true

      # Set deploy mode
      mage deploy:mode:set {{ .Values.magento.mode }} --skip-compilation || true

    else
      echo "=== FRESH INSTALL ==="

      {{- $primaryUser := index .Values.adminUsers 0 }}
      mage setup:install \
        --base-url="https://{{ .Values.magento.host }}/" \
        --base-url-secure="https://{{ .Values.magento.host }}/" \
        --db-host='127.0.0.1' \
        --db-name='{{ .Values.database.name }}' \
        --db-user='{{ .Values.database.user }}' \
        --db-password="${MYSQL_PASSWORD}" \
        --admin-firstname='{{ $primaryUser.firstname }}' \
        --admin-lastname='{{ $primaryUser.lastname }}' \
        --admin-email='{{ $primaryUser.email }}' \
        --admin-user='{{ $primaryUser.username }}' \
        --admin-password="${ADMIN_PASSWORD_0}" \
        --language='{{ .Values.magento.language }}' \
        --currency='{{ .Values.magento.currency }}' \
        --timezone='{{ .Values.magento.timezone }}' \
        --use-rewrites='1' \
        --backend-frontname='admin' \
        {{- if .Values.opensearch.enabled }}
        --search-engine='opensearch' \
        --opensearch-host='127.0.0.1' \
        --opensearch-port='9200'
        {{- end }}

      # Disable 2FA for development
      mage module:disable Magento_AdminAdobeImsTwoFactorAuth Magento_TwoFactorAuth || true

      # Set deploy mode
      mage deploy:mode:set {{ .Values.magento.mode }} --skip-compilation || true

      # SSL offloader config
      mage config:set web/secure/offloader_header X-Forwarded-Proto

      # Enable store codes in URLs
      mage config:set web/url/use_store 1

      mage setup:upgrade
      mage setup:di:compile

      # Note: catalog:images:resize runs in postStart after store views are created
      # This ensures all themes (Luma, Hyva, etc.) get their image caches

      # Mark as fresh install for postStart hooks
      touch /var/www/html/var/.fresh-install
    fi

    # Sync all admin users (idempotent)
    echo "Syncing admin users..."
    {{- range $i, $user := .Values.adminUsers }}
    mage admin:user:create \
      --admin-firstname='{{ $user.firstname }}' \
      --admin-lastname='{{ $user.lastname }}' \
      --admin-email='{{ $user.email }}' \
      --admin-user='{{ $user.username }}' \
      --admin-password="${ADMIN_PASSWORD_{{ $i }}}" || true
    {{- end }}

    fix_permissions
    mage maintenance:disable || true

    # Create marker file for postStart hook
    touch /var/www/html/var/.init-setup-complete

    echo "=== INIT SETUP COMPLETE ==="

  # setup.sh runs in postStart (async) - hooks and final cleanup only
  setup.sh: |
    #!/bin/bash
    set -e

    cd /var/www/html

    # Run bin/magento commands as www-data to ensure correct file ownership
    mage() {
      runuser -u www-data -- bin/magento "$@"
    }
    export -f mage

    fix_permissions() {
      chown -R www-data:www-data var/ generated/ pub/static/ pub/media/ app/etc/ plugins/ 2>/dev/null || true
      chmod -R 775 var/ generated/ 2>/dev/null || true
    }

    # Helper: Set store-level config using Magento's ConfigWriter API
    # Usage: magento_config_set_store <store_code> <path> <value>
    # Example: magento_config_set_store hyva design/theme/theme_id 5
    magento_config_set_store() {
      local store_code="$1"
      local config_path="$2"
      local config_value="$3"
      runuser -u www-data -- php -r "
        require 'app/bootstrap.php';
        \$bootstrap = \Magento\Framework\App\Bootstrap::create(BP, \$_SERVER);
        \$obj = \$bootstrap->getObjectManager();
        \$storeManager = \$obj->get(\Magento\Store\Model\StoreManagerInterface::class);
        \$configWriter = \$obj->get(\Magento\Framework\App\Config\Storage\WriterInterface::class);
        try {
          \$store = \$storeManager->getStore('$store_code');
          \$configWriter->save('$config_path', '$config_value', \Magento\Store\Model\ScopeInterface::SCOPE_STORES, \$store->getId());
          echo \"Set $config_path = $config_value for store $store_code (ID: \" . \$store->getId() . \")\n\";
        } catch (\Exception \$e) {
          echo \"Error: \" . \$e->getMessage() . \"\n\";
          exit(1);
        }
      "
    }
    export -f magento_config_set_store

    {{- if .Values.gitSync.plugins }}
    # Ensure plugin materialisation + symlinks exist (in case init containers didn't run)
    echo "Ensuring git-sync plugin stable paths..."
    mkdir -p /var/www/html/plugins
    {{- range .Values.gitSync.plugins }}
    mkdir -p /var/www/html/plugins/{{ .name }}
    rsync -aL --delete /var/www/html/git-sync/{{ .name }}/code/ /var/www/html/plugins/{{ .name }}/
    mkdir -p $(dirname /var/www/html/{{ .path }})
    rm -rf /var/www/html/{{ .path }}
    ln -sfn /var/www/html/plugins/{{ .name }} /var/www/html/{{ .path }}
    echo "Symlink: {{ .path }} -> /var/www/html/plugins/{{ .name }}"
    {{- end }}
    {{- end }}

    # Wait for init-setup to complete (marker file)
    echo "Waiting for init-setup to complete..."
    for i in $(seq 1 120); do
      if [ -f /var/www/html/var/.init-setup-complete ]; then
        echo "Init setup complete, running hooks..."
        break
      fi
      if [ $i -eq 120 ]; then
        echo "WARNING: Init setup marker not found, proceeding anyway"
        break
      fi
      sleep 2
    done

    {{- if .Values.hooks.preSetup }}
    # Hook: preSetup
    echo "Running preSetup hook..."
{{ .Values.hooks.preSetup | indent 4 }}
    {{- end }}

    # Determine if fresh install or upgrade
    INSTALL_TYPE="upgrade"
    if [ -f /var/www/html/var/.fresh-install ]; then
      INSTALL_TYPE="install"
      rm -f /var/www/html/var/.fresh-install
    fi

    {{- if or .Values.hooks.postInstall .Values.hooks.postUpgrade }}
    if [ "$INSTALL_TYPE" = "install" ]; then
      {{- if .Values.hooks.postInstall }}
      # Hook: postInstall
      echo "Running postInstall hook..."
{{ .Values.hooks.postInstall | indent 6 }}
      {{- else }}
      :  # no-op
      {{- end }}
    else
      {{- if .Values.hooks.postUpgrade }}
      # Hook: postUpgrade
      echo "Running postUpgrade hook..."
{{ .Values.hooks.postUpgrade | indent 6 }}
      {{- else }}
      :  # no-op
      {{- end }}
    fi
    {{- end }}

    {{- if or .Values.hooks.postSetup .Values.postScript }}
    # Hook: postSetup
    echo "Running postSetup hook..."
    {{- if .Values.hooks.postSetup }}
{{ .Values.hooks.postSetup | indent 4 }}
    {{- end }}
    {{- if .Values.postScript }}
    # DEPRECATED postScript (use hooks.postSetup)
{{ .Values.postScript | indent 4 }}
    {{- end }}
    {{- end }}

    {{- if .Values.staticContentDeploy.enabled }}
    # Pre-deploy static content for the configured areas/locales. Without this,
    # `deploy:mode:set ... --skip-compilation` leaves adminhtml serving stale
    # assets after upgrades. Frontend is often handled by a Hyva tailwind npm
    # build in postSetup, but running it here for both areas is safe (idempotent).
    {{- range .Values.staticContentDeploy.areas }}
    echo "Deploying static content for area={{ . }} locales: {{ join " " $.Values.staticContentDeploy.locales }}..."
    mage setup:static-content:deploy -f --area={{ . }} {{ join " " $.Values.staticContentDeploy.locales }} || true
    {{- end }}
    # Toggle dev/static/sign so rendered /static/ URLs include /version<ts>/...
    # — needed for safe long-cache CDN rules. Disabling reverts to unsigned URLs.
    mage config:set dev/static/sign {{ if .Values.staticContentDeploy.signing }}1{{ else }}0{{ end }} || true
    mage cache:flush || true
    fix_permissions
    {{- end }}

    # Resize catalog images for all stores/themes (must run after store creation).
    # Runs on fresh install, or on upgrade when init-setup restored missing
    # sample data (marker file set in that branch).
    if [ "$INSTALL_TYPE" = "install" ] || [ -f /var/www/html/var/.needs-catalog-resize ]; then
      echo "Resizing catalog images for all store views..."
      mage catalog:images:resize || true
      rm -f /var/www/html/var/.needs-catalog-resize
    fi

    # Final cleanup
    echo "Running final cleanup..."
    mage app:config:import --no-interaction || true
    mage indexer:reindex || true
    mage cache:flush
    mage maintenance:disable || true
    fix_permissions

    {{- if and .Values.gitSync.plugins .Values.gitSync.reload.enabled }}
    # Auto-reload Magento when git-sync pulls a new commit on any plugin branch.
    # Markers were seeded in init-setup right after symlinks were created, so
    # any flip during init-setup's DI compile or this script's long postSetup
    # phase is reliably caught by the watcher's first poll.
    (
      sleep {{ .Values.gitSync.reload.initialDelaySeconds }}
      while true; do
        changed=false
        changed_names=""
        for link in /var/www/html/git-sync/*/code; do
          [ -L "$link" ] || continue
          name=$(basename "$(dirname "$link")")
          current=$(readlink -f "$link" 2>/dev/null || true)
          [ -n "$current" ] || continue
          marker="/var/www/html/var/.gitsync-${name}-head"
          previous=$(cat "$marker" 2>/dev/null || true)
          if [ "$previous" != "$current" ]; then
            echo "git-sync change detected for ${name}: ${previous:-<none>} -> ${current}"
            echo "$current" > "$marker"
            changed=true
            changed_names="$changed_names $name"
          fi
        done
        if $changed; then
          # Refresh stable plugin paths from the new SHA before any cache /
          # DI work — rsync writes per-file via temp+rename so concurrent
          # requests never see partial files, and Magento's realpath-cached
          # entries (rooted at /var/www/html/plugins/<name>/) stay valid.
          for name in $changed_names; do
            rsync -aL --delete "/var/www/html/git-sync/${name}/code/" "/var/www/html/plugins/${name}/"
          done
          {{- if .Values.gitSync.reload.compile }}
          # Full rebuild path: rotation included DI/schema-affecting changes
          # (new di.xml preferences, constructor deps, or db_schema.xml). Run
          # the same sequence cold-start does so the running pod picks them
          # up without a kubectl rollout restart. flock serialises rebuilds
          # so a fast burst of rotations doesn't race itself.
          (
            flock -n 9 || { echo "rotation rebuild already in flight, skipping"; exit 0; }
            mage setup:upgrade
            rm -rf generated/code/* generated/metadata
            mage setup:di:compile
            {{- if eq .Values.magento.mode "production" }}
            {{- range .Values.staticContentDeploy.areas }}
            mage setup:static-content:deploy -f --area={{ . }} {{ join " " $.Values.staticContentDeploy.locales }}
            {{- end }}
            {{- end }}
            mage cache:flush
            fix_permissions
            apachectl -k graceful || true
            sleep 2
            smoke=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/health_check.php || echo "000")
            if [ "$smoke" != "200" ]; then
              echo "ALERT: post-rotation smoke failed: HTTP $smoke"
            fi
            echo "git-sync auto-reload (full rebuild) complete"
          ) 9>/var/www/html/var/.gitsync-rebuild.lock
          {{- else }}
          {{- if .Values.staticContentDeploy.enabled }}
          # Re-deploy static content from the new SHA. Materialises real files
          # (no symlinks) so the new plugin assets are served immediately and
          # don't depend on git-sync worktree paths that may be pruned later.
          {{- range .Values.staticContentDeploy.areas }}
          mage setup:static-content:deploy -f --area={{ . }} {{ join " " $.Values.staticContentDeploy.locales }} || true
          {{- end }}
          {{- else }}
          # Static-content-deploy disabled: clear lazy-generated artefacts so
          # the next request regenerates them (as symlinks in developer mode)
          # against the new SHA. Keeps DI cache in sync with whatever the
          # plugin's di.xml / events.xml define.
          rm -rf {{ join " " .Values.gitSync.reload.developerClearPaths }} 2>/dev/null || true
          {{- end }}
          mage cache:flush || true
          fix_permissions
          apachectl -k graceful || true
          echo "git-sync auto-reload complete"
          {{- end }}
        fi
        sleep {{ .Values.gitSync.reload.pollIntervalSeconds }}
      done
    ) &
    {{- end }}

    # Reload Apache to pick up any changes
    apachectl -k graceful || true

    echo "=== SETUP COMPLETE ==="
