apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "magento.fullname" . }}-setup
  labels:
    {{- include "magento.labels" . | nindent 4 }}
data:
  # init-setup.sh runs in init container (blocking) - core Magento setup
  init-setup.sh: |
    #!/bin/bash
    set -e

    cd /var/www/html

    # Run bin/magento commands as www-data to ensure correct file ownership
    mage() {
      runuser -u www-data -- bin/magento "$@"
    }

    fix_permissions() {
      echo "Fixing permissions..."
      chown -R www-data:www-data var/ generated/ pub/static/ pub/media/ app/etc/ plugins/ 2>/dev/null || true
      chmod -R 775 var/ generated/ 2>/dev/null || true
    }

    # Always run fix_permissions on exit, including on `set -e` aborts. Without
    # this, any failure between the final fix_permissions and script end (e.g.
    # a hook command without `|| true`) leaves whatever root-owned files were
    # written by earlier root-mode bin/magento calls (e.g. when a hook author
    # bypasses the `mage` wrapper). Those files break the next pod's runtime
    # cache writes intermittently — the failure mode shows up as a 500 on a
    # specific admin page rather than a clean restart-time error.
    trap fix_permissions EXIT

    {{- if .Values.staticContentDeploy.enabled }}
{{ include "magento.staticSlotsShell" . | indent 4 }}

    # Convert pub/static to the A/B slot layout on first run (no-op after
    # that). Done here, in the init container, so the one non-atomic moment
    # of the conversion happens before Apache accepts any traffic. A failure
    # is not fatal: the layout stays as it is and sc_deploy falls back to the
    # in-place deploy, i.e. the behaviour that shipped before PLAT-2002.
    sc_slots_init || echo "WARNING: static slot conversion failed; deploys will run in place"
    {{- end }}

    {{- if .Values.redis.enabled }}
    # Wire app/etc/env.php to use the Redis sidecar for cache.default,
    # cache.page_cache, and session. Idempotent — setup:config:set just
    # rewrites the relevant keys in env.php. Used by the UPGRADE path
    # below to realign env.php with values.yaml on every restart. The
    # FRESH-INSTALL path bypasses this function and folds the same
    # flags directly into setup:install so the install itself runs
    # against Redis from line 1 (no filesystem-cache → Redis switch
    # mid-install).
    #
    # Redis is sidecar-local, so the host is unconditionally 127.0.0.1
    # — this chart does not support external Redis (no password / tls
    # knobs). See values.yaml redis: block for the design note.
    configure_redis_backends() {
      echo "Configuring Redis backends in env.php..."
      mage setup:config:set --no-interaction \
        --cache-backend=redis \
        --cache-backend-redis-server=127.0.0.1 \
        --cache-backend-redis-port={{ .Values.redis.port }} \
        --cache-backend-redis-db={{ .Values.redis.databases.default }} \
        --page-cache=redis \
        --page-cache-redis-server=127.0.0.1 \
        --page-cache-redis-port={{ .Values.redis.port }} \
        --page-cache-redis-db={{ .Values.redis.databases.pageCache }} \
        --session-save=redis \
        --session-save-redis-host=127.0.0.1 \
        --session-save-redis-port={{ .Values.redis.port }} \
        --session-save-redis-db={{ .Values.redis.databases.session }} \
        --session-save-redis-log-level={{ .Values.redis.session.logLevel }} \
        --session-save-redis-max-concurrency={{ .Values.redis.session.maxConcurrency }}
    }
    {{- end }}

    {{- if .Values.gitSync.plugins }}
    # Materialise git-sync plugins to a stable, non-rotating path.
    #
    # PHP's __DIR__ resolves through symlinks at include time, so registering
    # a module via a symlink that targets git-sync's SHA-named worktree
    # (.worktrees/<sha>/) bakes the SHA into Magento's config cache and
    # compiled DI metadata. When git-sync rotates and prunes the old
    # worktree, every cached path 500s with "module.xml file can't be read".
    #
    # Fix: rsync the worktree contents into /var/www/html/plugins/<name>/
    # (a real directory whose path never changes) and point app/code/...
    # at that. realpath() now resolves to the stable path; rotations only
    # need to refresh contents, not paths.
    echo "Materialising git-sync plugins to stable paths..."
    mkdir -p /var/www/html/plugins
    {{- range .Values.gitSync.plugins }}
    mkdir -p /var/www/html/plugins/{{ .name }}
    rsync -aL --delete /var/www/html/git-sync/{{ .name }}/code/{{ with .sourcePath }}{{ . }}/{{ end }} /var/www/html/plugins/{{ .name }}/
    {{- if .sourcePath }}
    # sourcePath narrows the rsync to a repo subdir, leaving the
    # repo-root composer.json and worktree .git file behind. Copy
    # them over so downstream tooling that reads module version /
    # commit SHA from the deployed module dir (e.g. admin diagnostic
    # widgets) finds them in the same place as the no-sourcePath
    # layout. The .git file's gitdir: path is no longer resolvable
    # post-copy, but its `worktrees/<sha>` segment — the only field
    # consumers parse — is preserved verbatim.
    cp -f /var/www/html/git-sync/{{ .name }}/code/composer.json /var/www/html/plugins/{{ .name }}/composer.json 2>/dev/null || true
    cp -f /var/www/html/git-sync/{{ .name }}/code/.git /var/www/html/plugins/{{ .name }}/.git 2>/dev/null || true
    {{- end }}
    mkdir -p $(dirname /var/www/html/{{ .path }})
    rm -rf /var/www/html/{{ .path }}
    ln -sf /var/www/html/plugins/{{ .name }} /var/www/html/{{ .path }}
    echo "Symlink: {{ .path }} -> /var/www/html/plugins/{{ .name }}{{ with .sourcePath }} (from subpath {{ . }}){{ end }}"
    {{- end }}

    # Seed git-sync SHA markers so the in-pod gitsync watcher has a
    # baseline to compare against for any rotation that lands after
    # init-setup completes. Marker files live in /var/www/html/var
    # (PVC-backed under magento/var) and survive pod restarts.
    declare -A GITSYNC_CURR
    for link in /var/www/html/git-sync/*/code; do
      [ -L "$link" ] || continue
      name=$(basename "$(dirname "$link")")
      current=$(readlink -f "$link" 2>/dev/null || true)
      [ -n "$current" ] || continue
      GITSYNC_CURR[$name]="$current"
    done
    for name in "${!GITSYNC_CURR[@]}"; do
      echo "${GITSYNC_CURR[$name]}" > "/var/www/html/var/.gitsync-${name}-head"
      echo "git-sync marker seeded for ${name}: ${GITSYNC_CURR[$name]}"
    done
    {{- end }}

    # Wait for database (sidecar should be ready)
    echo "Waiting for database..."
    for i in $(seq 1 60); do
      if mysql -h 127.0.0.1 -u {{ .Values.database.user }} -p"$MYSQL_PASSWORD" --skip-ssl -e "SELECT 1" &>/dev/null; then
        echo "Database is ready"
        break
      fi
      if [ $i -eq 60 ]; then
        echo "ERROR: Database not ready after 60 attempts"
        exit 1
      fi
      sleep 2
    done

    {{- if .Values.opensearch.enabled }}
    # Wait for OpenSearch (sidecar should be ready)
    echo "Waiting for OpenSearch..."
    for i in $(seq 1 60); do
      if curl -s http://127.0.0.1:9200/_cluster/health &>/dev/null; then
        echo "OpenSearch is ready"
        break
      fi
      if [ $i -eq 60 ]; then
        echo "ERROR: OpenSearch not ready after 60 attempts"
        exit 1
      fi
      sleep 2
    done
    {{- end }}

    {{- if .Values.redis.enabled }}
    # Wait for Redis (sidecar should be ready). Required before
    # setup:upgrade / setup:install — both bootstrap the cache layer and
    # will fail-fast if env.php points at an unreachable backend.
    echo "Waiting for Redis..."
    for i in $(seq 1 30); do
      # Bash /dev/tcp probe — avoids depending on redis-cli being in the
      # magento image. A successful connection means Redis is accepting
      # clients; setup:config:set only writes env.php, the actual PING
      # round-trips happen later when Magento boots its cache layer.
      if (echo > /dev/tcp/127.0.0.1/{{ .Values.redis.port }}) 2>/dev/null; then
        echo "Redis is ready"
        break
      fi
      if [ $i -eq 30 ]; then
        echo "ERROR: Redis not ready after 30 attempts"
        exit 1
      fi
      sleep 2
    done
    {{- end }}

    # Restore sample-data-media if missing (idempotent via cp -n).
    # Runs for both install and upgrade paths so PVCs that lost their media
    # (or were created before this copy block existed) can recover without a
    # manual intervention. If the catalog was empty before the copy, flag a
    # marker so postStart runs catalog:images:resize to populate the cache.
    if [ -d /var/www/html/vendor/magento/sample-data-media/catalog ]; then
      CATALOG_BEFORE=$(find /var/www/html/pub/media/catalog/product -type f 2>/dev/null | head -1)
      cp -rn /var/www/html/vendor/magento/sample-data-media/* /var/www/html/pub/media/
      chown -R www-data:www-data /var/www/html/pub/media/
      CATALOG_AFTER=$(find /var/www/html/pub/media/catalog/product -type f 2>/dev/null | head -1)
      if [ -z "$CATALOG_BEFORE" ] && [ -n "$CATALOG_AFTER" ]; then
        echo "Sample data media restored from image — flagging catalog resize"
        touch /var/www/html/var/.needs-catalog-resize
      fi
    fi

    # Restore the sample-data CMS stylesheet. Ships with module-cms-sample-data
    # and is referenced by the 'design/head/includes' core_config_data row
    # (value: <link ... href="{{ "{{" }}MEDIA_URL}}styles.css" />). Contains the
    # .block-promo.* rules that style
    # the Luma homepage CMS grid. The fresh-install fixture loader drops it
    # into pub/media/, but nothing restores it on upgrade if the PVC loses it.
    if [ -f /var/www/html/vendor/magento/module-cms-sample-data/fixtures/styles.css ] \
       && [ ! -f /var/www/html/pub/media/styles.css ]; then
      cp /var/www/html/vendor/magento/module-cms-sample-data/fixtures/styles.css \
         /var/www/html/pub/media/styles.css
      chown www-data:www-data /var/www/html/pub/media/styles.css
      echo "Sample data styles.css restored to pub/media/"
    fi

    # Hand off any root-owned marker files (gitsync-*-head, needs-catalog-resize)
    # to www-data before setup:install runs as that user — its pre-flight
    # File permissions check refuses to start otherwise.
    fix_permissions

    # Check if Magento is already installed
    if [ -f app/etc/env.php ]; then

      echo "=== UPGRADE PATH ==="

      # Backup env.php before upgrade
      cp app/etc/env.php app/etc/env.php.bak

      {{- if .Values.redis.enabled }}
      # Re-assert Redis backends in env.php before setup:upgrade. The
      # upgrade reads cache config, so any drift from values.yaml needs
      # to land here and not after.
      configure_redis_backends || {
        echo "configure_redis_backends failed, restoring env.php backup"
        cp app/etc/env.php.bak app/etc/env.php
        exit 1
      }
      {{- end }}

      echo "Running setup:upgrade..."
      mage setup:upgrade || {
        echo "setup:upgrade failed, restoring env.php backup"
        cp app/etc/env.php.bak app/etc/env.php
        exit 1
      }

      # Clean generated code
      rm -rf generated/code generated/metadata

      echo "Running setup:di:compile..."
      mage setup:di:compile || {
        echo "setup:di:compile failed, restoring env.php backup"
        cp app/etc/env.php.bak app/etc/env.php
        exit 1
      }

      # Flush all caches after di:compile (ABN-415 workaround).
      #
      # The structure-cache file at
      #   var/cache/mage--*/mage---*_ADMINHTML__BACKEND_SYSTEM_CONFIGURATION_STRUCTURE
      # is written into the `data` PVC under the `magento/var` subpath, so it
      # persists across pod restarts. A previous pod that completed
      # Reader::read without a brand-overlay synthesis plugin (e.g. because
      # the plugin's DI metadata pointed at an older constructor signature)
      # leaves a cache file that has the static abn_gateway tab but NO
      # synthesised abn_payment / abn_general / abn_search / abn_version
      # sections. The new pod inherits that cache, Scoped::_loadScopedData
      # hits the cache on the first admin request, never calls Reader::read,
      # and the synthesis plugin never fires for the pod's lifetime — the
      # ABN admin tab disappears.
      #
      # Wiping after setup:di:compile guarantees that the next Reader::read
      # picks up the freshly-deployed plugin set (and the freshly-compiled
      # interceptors), with no PVC-borne stale data sitting in front of it.
      # `bin/magento cache:flush` is cheap (~3 s) and idempotent.
      mage cache:flush || true

      # Validate env.php has install date
      php -r "
        \$c = include 'app/etc/env.php';
        if (!isset(\$c['install']['date'])) {
          \$c['install'] = ['date' => date('r')];
          file_put_contents('app/etc/env.php', '<?php return '.var_export(\$c,true).';');
          echo \"Fixed missing install date in env.php\n\";
        }
      "

      # Disable 2FA modules on every upgrade too — sample-data fixtures or
      # a setup:upgrade from a vendor version where they were enabled can
      # otherwise lock admins out after an upgrade.
      mage module:disable Magento_AdminAdobeImsTwoFactorAuth Magento_TwoFactorAuth || true

      # Set deploy mode
      mage deploy:mode:set {{ .Values.magento.mode }} --skip-compilation || true

    else
      echo "=== FRESH INSTALL ==="

      {{- $primaryUser := index .Values.adminUsers 0 }}
      mage setup:install \
        --base-url="https://{{ .Values.magento.host }}/" \
        --base-url-secure="https://{{ .Values.magento.host }}/" \
        --db-host='127.0.0.1' \
        --db-name='{{ .Values.database.name }}' \
        --db-user='{{ .Values.database.user }}' \
        --db-password="${MYSQL_PASSWORD}" \
        --admin-firstname='{{ $primaryUser.firstname }}' \
        --admin-lastname='{{ $primaryUser.lastname }}' \
        --admin-email='{{ $primaryUser.email }}' \
        --admin-user='{{ $primaryUser.username }}' \
        --admin-password="${ADMIN_PASSWORD_0}" \
        --language='{{ .Values.magento.language }}' \
        --currency='{{ .Values.magento.currency }}' \
        --timezone='{{ .Values.magento.timezone }}' \
        --use-rewrites='1' \
        --backend-frontname='admin' \
        {{- if .Values.opensearch.enabled }}
        --search-engine='opensearch' \
        --opensearch-host='127.0.0.1' \
        --opensearch-port='9200' \
        {{- end }}
        {{- if .Values.redis.enabled }}
        --cache-backend=redis \
        --cache-backend-redis-server=127.0.0.1 \
        --cache-backend-redis-port={{ .Values.redis.port }} \
        --cache-backend-redis-db={{ .Values.redis.databases.default }} \
        --page-cache=redis \
        --page-cache-redis-server=127.0.0.1 \
        --page-cache-redis-port={{ .Values.redis.port }} \
        --page-cache-redis-db={{ .Values.redis.databases.pageCache }} \
        --session-save=redis \
        --session-save-redis-host=127.0.0.1 \
        --session-save-redis-port={{ .Values.redis.port }} \
        --session-save-redis-db={{ .Values.redis.databases.session }} \
        --session-save-redis-log-level={{ .Values.redis.session.logLevel }} \
        --session-save-redis-max-concurrency={{ .Values.redis.session.maxConcurrency }} \
        {{- end }}
        --no-interaction

      # Note: Redis backends (when redis.enabled) are wired in directly
      # via setup:install above — no separate configure_redis_backends
      # call is needed on the fresh-install path. This avoids
      # setup:install populating the filesystem cache before the switch
      # to Redis, stranding cache entries on the now-unused filesystem
      # path.

      # Disable 2FA for development
      mage module:disable Magento_AdminAdobeImsTwoFactorAuth Magento_TwoFactorAuth || true

      # Set deploy mode
      mage deploy:mode:set {{ .Values.magento.mode }} --skip-compilation || true

      # SSL offloader config
      mage config:set web/secure/offloader_header X-Forwarded-Proto

      # Enable store codes in URLs
      mage config:set web/url/use_store 1

      mage setup:upgrade
      mage setup:di:compile

      # Note: catalog:images:resize runs in postStart after store views are created
      # This ensures all themes (Luma, Hyva, etc.) get their image caches

      # Mark as fresh install for postStart hooks
      touch /var/www/html/var/.fresh-install
    fi

    # Ensure admin users exist (idempotent).
    #
    # `bin/magento admin:user:create` is NOT a no-op when the user already
    # exists — in Magento 2.4.x it upserts and resets the password to the
    # value supplied. Calling it unconditionally on every pod restart means
    # any password reset performed via the admin UI is reverted to the
    # secret-backed default on the next rollout (see ABN-419). Probe the
    # admin_user table directly via Magento's bootstrap and only invoke
    # create for genuinely missing users. The DB probe is reliable across
    # Magento versions; matching on CLI error strings is not.
    echo "Syncing admin users..."
    admin_user_exists() {
      local user="$1"
      runuser -u www-data -- php -r "
        require '/var/www/html/app/bootstrap.php';
        \$b = Magento\Framework\App\Bootstrap::create(BP, \$_SERVER);
        \$conn = \$b->getObjectManager()
          ->get(Magento\Framework\App\ResourceConnection::class)
          ->getConnection();
        \$n = (int)\$conn->fetchOne(
          'SELECT COUNT(*) FROM admin_user WHERE username = ?',
          ['$user']
        );
        echo \$n > 0 ? 'yes' : 'no';
      " 2>/dev/null
    }
    {{- range $i, $user := .Values.adminUsers }}
    case "$(admin_user_exists '{{ $user.username }}')" in
      yes)
        echo "[ADMIN] {{ $user.username }} already exists; leaving password alone"
        ;;
      no)
        echo "[ADMIN] {{ $user.username }} does not exist; creating"
        mage admin:user:create \
          --admin-firstname='{{ $user.firstname }}' \
          --admin-lastname='{{ $user.lastname }}' \
          --admin-email='{{ $user.email }}' \
          --admin-user='{{ $user.username }}' \
          --admin-password="${ADMIN_PASSWORD_{{ $i }}}" || true
        ;;
      *)
        echo "[ADMIN] probe for {{ $user.username }} failed; skipping create to avoid clobbering an existing user"
        ;;
    esac
    {{- end }}

    fix_permissions
    mage maintenance:disable || true

    # Create marker file for postStart hook
    touch /var/www/html/var/.init-setup-complete

    echo "=== INIT SETUP COMPLETE ==="

  # setup.sh runs in postStart (async) - hooks and final cleanup only
  setup.sh: |
    #!/bin/bash
    set -e

    cd /var/www/html

    # Run bin/magento commands as www-data to ensure correct file ownership
    mage() {
      runuser -u www-data -- bin/magento "$@"
    }
    export -f mage

    fix_permissions() {
      chown -R www-data:www-data var/ generated/ pub/static/ pub/media/ app/etc/ plugins/ 2>/dev/null || true
      chmod -R 775 var/ generated/ 2>/dev/null || true
    }

    # Always run fix_permissions on exit, including on `set -e` aborts. Without
    # this, a hook command without `|| true` (npm, php -r, etc.) can abort the
    # script before the final fix_permissions call, leaving root-owned cache
    # files written by earlier root-mode bin/magento invocations in the hook.
    # The runtime symptom is a 500 on a specific admin page rather than a
    # clean restart-time error: a www-data php-fpm worker calling
    # describeTable() can't overwrite the root-owned DDL cache file and the
    # warning gets escalated by the error handler.
    trap fix_permissions EXIT

    {{- if .Values.staticContentDeploy.enabled }}
{{ include "magento.staticSlotsShell" . | indent 4 }}
    {{- end }}

    # Helper: Set store-level config using Magento's ConfigWriter API
    # Usage: magento_config_set_store <store_code> <path> <value>
    # Example: magento_config_set_store hyva design/theme/theme_id 5
    magento_config_set_store() {
      local store_code="$1"
      local config_path="$2"
      local config_value="$3"
      runuser -u www-data -- php -r "
        require 'app/bootstrap.php';
        \$bootstrap = \Magento\Framework\App\Bootstrap::create(BP, \$_SERVER);
        \$obj = \$bootstrap->getObjectManager();
        \$storeManager = \$obj->get(\Magento\Store\Model\StoreManagerInterface::class);
        \$configWriter = \$obj->get(\Magento\Framework\App\Config\Storage\WriterInterface::class);
        try {
          \$store = \$storeManager->getStore('$store_code');
          \$configWriter->save('$config_path', '$config_value', \Magento\Store\Model\ScopeInterface::SCOPE_STORES, \$store->getId());
          echo \"Set $config_path = $config_value for store $store_code (ID: \" . \$store->getId() . \")\n\";
        } catch (\Exception \$e) {
          echo \"Error: \" . \$e->getMessage() . \"\n\";
          exit(1);
        }
      "
    }
    export -f magento_config_set_store

    {{- if .Values.gitSync.plugins }}
    # Ensure plugin materialisation + symlinks exist (in case init containers didn't run)
    echo "Ensuring git-sync plugin stable paths..."
    mkdir -p /var/www/html/plugins
    {{- range .Values.gitSync.plugins }}
    mkdir -p /var/www/html/plugins/{{ .name }}
    rsync -aL --delete /var/www/html/git-sync/{{ .name }}/code/{{ with .sourcePath }}{{ . }}/{{ end }} /var/www/html/plugins/{{ .name }}/
    {{- if .sourcePath }}
    # Mirror init-setup.sh: bring repo-root composer.json + .git
    # over when sourcePath narrowed the rsync to a subdir.
    cp -f /var/www/html/git-sync/{{ .name }}/code/composer.json /var/www/html/plugins/{{ .name }}/composer.json 2>/dev/null || true
    cp -f /var/www/html/git-sync/{{ .name }}/code/.git /var/www/html/plugins/{{ .name }}/.git 2>/dev/null || true
    {{- end }}
    mkdir -p $(dirname /var/www/html/{{ .path }})
    rm -rf /var/www/html/{{ .path }}
    ln -sfn /var/www/html/plugins/{{ .name }} /var/www/html/{{ .path }}
    echo "Symlink: {{ .path }} -> /var/www/html/plugins/{{ .name }}{{ with .sourcePath }} (from subpath {{ . }}){{ end }}"
    {{- end }}
    {{- end }}

    # Wait for init-setup to complete (marker file)
    echo "Waiting for init-setup to complete..."
    for i in $(seq 1 120); do
      if [ -f /var/www/html/var/.init-setup-complete ]; then
        echo "Init setup complete, running hooks..."
        break
      fi
      if [ $i -eq 120 ]; then
        echo "WARNING: Init setup marker not found, proceeding anyway"
        break
      fi
      sleep 2
    done

    {{- if .Values.hooks.preSetup }}
    # Hook: preSetup
    echo "Running preSetup hook..."
{{ .Values.hooks.preSetup | indent 4 }}
    {{- end }}

    # Determine if fresh install or upgrade
    INSTALL_TYPE="upgrade"
    if [ -f /var/www/html/var/.fresh-install ]; then
      INSTALL_TYPE="install"
      rm -f /var/www/html/var/.fresh-install
    fi

    {{- if or .Values.hooks.postInstall .Values.hooks.postUpgrade }}
    if [ "$INSTALL_TYPE" = "install" ]; then
      {{- if .Values.hooks.postInstall }}
      # Hook: postInstall
      echo "Running postInstall hook..."
{{ .Values.hooks.postInstall | indent 6 }}
      {{- else }}
      :  # no-op
      {{- end }}
    else
      {{- if .Values.hooks.postUpgrade }}
      # Hook: postUpgrade
      echo "Running postUpgrade hook..."
{{ .Values.hooks.postUpgrade | indent 6 }}
      {{- else }}
      :  # no-op
      {{- end }}
    fi
    {{- end }}

    {{- if or .Values.hooks.postSetup .Values.postScript }}
    # Hook: postSetup
    echo "Running postSetup hook..."
    {{- if .Values.hooks.postSetup }}
{{ .Values.hooks.postSetup | indent 4 }}
    {{- end }}
    {{- if .Values.postScript }}
    # DEPRECATED postScript (use hooks.postSetup)
{{ .Values.postScript | indent 4 }}
    {{- end }}
    {{- end }}

    {{- if .Values.staticContentDeploy.enabled }}
    # Pre-deploy static content for the configured areas/locales. Without this,
    # `deploy:mode:set ... --skip-compilation` leaves adminhtml serving stale
    # assets after upgrades. Frontend is often handled by a Hyva tailwind npm
    # build in postSetup, but running it here for both areas is safe (idempotent).
    #
    # Doubles as the self-heal path: a livenessProbe that checks for
    # deployed_version.txt will restart the container if a previous rotation
    # crashed mid-redeploy and left pub/static/ empty. postStart re-fires this
    # script and the missing-marker branch below repopulates everything.
    #
    # Held under .static-rebuild.lock because an in-place -f deploy purges
    # pub/static/ for minutes. The liveness probe treats a held lock as "alive
    # and rebuilding"; without the lock the probe would kill this recovery
    # before it finishes and the pod could never heal itself. Uncontended in
    # practice — the git-sync watcher only starts further down. (With
    # atomicSwap on, sc_deploy builds into the idle slot and pub/static is
    # never empty, but the lock still serialises concurrent rebuilds.)
    if [ ! -s /var/www/html/pub/static/deployed_version.txt ]; then
      echo "deployed_version.txt missing — running static-content:deploy"
      (
      flock 9
      # Builds into the idle slot and flips, or falls back to an in-place
      # purge-and-rebuild with the historical snapshot rollback.
      sc_deploy || echo "ERROR: static-content deploy did not complete"
      # Toggle dev/static/sign so rendered /static/ URLs include /version<ts>/...
      # — needed for safe long-cache CDN rules. Disabling reverts to unsigned URLs.
      mage config:set dev/static/sign {{ if .Values.staticContentDeploy.signing }}1{{ else }}0{{ end }} || true
      mage cache:flush || true
      fix_permissions
      ) 9>>/var/www/html/var/.static-rebuild.lock
    else
      echo "static content present (deployed_version.txt non-empty), skipping deploy"
    fi
    {{- end }}

    # Resize catalog images for all stores/themes (must run after store creation).
    # Runs on fresh install, or on upgrade when init-setup restored missing
    # sample data (marker file set in that branch).
    if [ "$INSTALL_TYPE" = "install" ] || [ -f /var/www/html/var/.needs-catalog-resize ]; then
      echo "Resizing catalog images for all store views..."
      mage catalog:images:resize || true
      rm -f /var/www/html/var/.needs-catalog-resize
    fi

    # Final cleanup
    echo "Running final cleanup..."
    mage app:config:import --no-interaction || true
    mage indexer:reindex || true
    mage cache:flush
    mage maintenance:disable || true
    fix_permissions

    {{- if and .Values.gitSync.plugins .Values.gitSync.reload.enabled }}
    # Auto-reload Magento when git-sync pulls a new commit on any plugin branch.
    # Markers were seeded in init-setup right after symlinks were created, so
    # any flip during init-setup's DI compile or this script's long postSetup
    # phase is reliably caught by the watcher's first poll.
    #
    # Concurrency model:
    #   * markers are written *after* a verified-good rebuild, never before —
    #     a failed rebuild leaves the marker on the previous SHA so the next
    #     poll retries automatically. without this, a single transient failure
    #     (php fatal during di:compile, fs race during -f purge) wedges the
    #     pod on a half-built install with no self-recovery path.
    #   * markers track the symlink target *as observed after* the rebuild,
    #     not the SHA captured at detection time. so a burst of N pushes
    #     during one rebuild collapses to one rebuild + one marker write
    #     (the rebuild itself rsyncs from the live symlink, so it always
    #     processes the latest SHA git-sync has materialised by then).
    #   * flock serialises rebuilds within a single pod; if a rotation
    #     lands while a rebuild is in flight, the watcher logs and retries
    #     on the next poll.
    (
      sleep {{ .Values.gitSync.reload.initialDelaySeconds }}
      # name -> sourcePath subdir within each plugin's git-sync checkout
      # (empty string means materialise from the repo root).
      declare -A GITSYNC_SOURCE_PATHS
      {{- range .Values.gitSync.plugins }}
      GITSYNC_SOURCE_PATHS[{{ .name }}]={{ .sourcePath | default "" | quote }}
      {{- end }}
      while true; do
        changed=false
        changed_names=""
        for link in /var/www/html/git-sync/*/code; do
          [ -L "$link" ] || continue
          name=$(basename "$(dirname "$link")")
          current=$(readlink -f "$link" 2>/dev/null || true)
          [ -n "$current" ] || continue
          marker="/var/www/html/var/.gitsync-${name}-head"
          previous=$(cat "$marker" 2>/dev/null || true)
          if [ "$previous" != "$current" ]; then
            echo "git-sync change detected for ${name}: ${previous:-<none>} -> ${current}"
            changed=true
            changed_names="$changed_names $name"
          fi
        done
        if $changed; then
          # Refresh stable plugin paths from the live symlink (which may have
          # advanced past the SHA that triggered detection if more pushes
          # have landed). rsync writes per-file via temp+rename so concurrent
          # requests never see partial files, and Magento's realpath-cached
          # entries (rooted at /var/www/html/plugins/<name>/) stay valid.
          for name in $changed_names; do
            sp="${GITSYNC_SOURCE_PATHS[$name]:-}"
            rsync -aL --delete "/var/www/html/git-sync/${name}/code/${sp:+${sp}/}" "/var/www/html/plugins/${name}/"
            if [ -n "$sp" ]; then
              # sourcePath layout: rsync narrowed to a subdir, so the
              # repo-root composer.json and worktree .git file didn't
              # travel. Mirror init-setup.sh: copy them so the deployed
              # module dir always has the metadata downstream tooling
              # expects (see init-setup.sh for the longer rationale).
              cp -f "/var/www/html/git-sync/${name}/code/composer.json" "/var/www/html/plugins/${name}/composer.json" 2>/dev/null || true
              cp -f "/var/www/html/git-sync/${name}/code/.git" "/var/www/html/plugins/${name}/.git" 2>/dev/null || true
            fi
          done
          {{- if .Values.gitSync.reload.compile }}
          # Full rebuild path: rotation included DI/schema-affecting changes
          # (new di.xml preferences, constructor deps, or db_schema.xml). Run
          # the same sequence cold-start does so the running pod picks them
          # up without a kubectl rollout restart. flock serialises rebuilds
          # so a fast burst of rotations doesn't race itself, and doubles as
          # the signal to the liveness probe that pub/static/ is empty because
          # a rebuild is in flight rather than because it broke.
          rebuild_ok=false
          (
            flock -n 9 || { echo "rotation rebuild already in flight, skipping"; exit 2; }
            set -euo pipefail
            trap 'echo "ERROR: rotation rebuild failed at line $LINENO with exit $?"' ERR
            trap fix_permissions EXIT
            mage setup:upgrade
            rm -rf generated/code/* generated/metadata 2>/dev/null || true
            mage setup:di:compile
            {{- if eq .Values.magento.mode "production" }}
            # Rebuild static content. With atomicSwap the build lands in the
            # idle slot and goes live with one symlink rename, so the
            # storefront serves the previous bundle throughout and never sees
            # an empty pub/static; the previously live slot is what
            # sc_rollback flips back to on smoke failure below.
            sc_deploy
            {{- end }}
            mage cache:flush
            fix_permissions
            apachectl -k graceful || true
            sleep 2
            smoke=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/health_check.php || echo "000")
            if [ "$smoke" != "200" ]; then
              echo "ALERT: post-rotation smoke failed: HTTP $smoke — rolling back"
              {{- if eq .Values.magento.mode "production" }}
              sc_rollback || true
              apachectl -k graceful || true
              {{- end }}
              exit 1
            fi
            echo "git-sync auto-reload (full rebuild) complete"
          ) 9>>/var/www/html/var/.static-rebuild.lock && rebuild_ok=true
          if $rebuild_ok; then
            # Read the symlink *now* — burst pushes during the rebuild may
            # have advanced it past the SHA we detected. The rebuild rsynced
            # from the live symlink so it already incorporated those pushes;
            # writing the post-rebuild SHA collapses the burst into a single
            # marker write and prevents a spurious follow-up rebuild.
            for name in $changed_names; do
              final=$(readlink -f "/var/www/html/git-sync/${name}/code" 2>/dev/null || true)
              if [ -n "$final" ]; then
                echo "$final" > "/var/www/html/var/.gitsync-${name}-head"
              fi
            done
          else
            echo "rotation rebuild not committed; markers left at previous SHAs for retry on next poll"
          fi
          {{- else }}
          fast_ok=false
          (
            flock -n 9 || { echo "rotation fast-reload already in flight, skipping"; exit 2; }
            set -euo pipefail
            trap 'echo "ERROR: rotation fast-reload failed at line $LINENO with exit $?"' ERR
            trap fix_permissions EXIT
            {{- if .Values.staticContentDeploy.enabled }}
            # Re-deploy static content from the new SHA. Materialises real files
            # (no symlinks) so the new plugin assets are served immediately and
            # don't depend on git-sync worktree paths that may be pruned later.
            # With atomicSwap this builds into the idle slot and flips.
            sc_deploy
            {{- else }}
            # Static-content-deploy disabled: clear lazy-generated artefacts so
            # the next request regenerates them (as symlinks in developer mode)
            # against the new SHA. Keeps DI cache in sync with whatever the
            # plugin's di.xml / events.xml define.
            rm -rf {{ join " " .Values.gitSync.reload.developerClearPaths }} 2>/dev/null || true
            {{- end }}
            mage cache:flush || true
            fix_permissions
            apachectl -k graceful || true
            sleep 2
            smoke=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/health_check.php || echo "000")
            if [ "$smoke" != "200" ]; then
              echo "ALERT: post-rotation smoke failed: HTTP $smoke — rolling back"
              {{- if .Values.staticContentDeploy.enabled }}
              sc_rollback || true
              apachectl -k graceful || true
              {{- end }}
              exit 1
            fi
            echo "git-sync auto-reload complete"
          ) 9>>/var/www/html/var/.static-rebuild.lock && fast_ok=true
          if $fast_ok; then
            # Read the symlink *now* (post-reload) so burst pushes that
            # landed during the reload coalesce into a single marker write.
            for name in $changed_names; do
              final=$(readlink -f "/var/www/html/git-sync/${name}/code" 2>/dev/null || true)
              if [ -n "$final" ]; then
                echo "$final" > "/var/www/html/var/.gitsync-${name}-head"
              fi
            done
          else
            echo "rotation fast-reload not committed; markers left at previous SHAs for retry on next poll"
          fi
          {{- end }}
        fi
        sleep {{ .Values.gitSync.reload.pollIntervalSeconds }}
      done
    ) &
    {{- end }}

    # Reload Apache to pick up any changes
    apachectl -k graceful || true

    echo "=== SETUP COMPLETE ==="
