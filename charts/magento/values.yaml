# Magento Helm Chart Values
# https://github.com/brtkwr/magento-helm

image:
  repository: ghcr.io/brtkwr/magento
  tag: "2.4.8"
  pullPolicy: IfNotPresent

# ServiceAccount for the pods. Set create=true + annotations to bind a
# GCP service account via GKE Workload Identity — required for the
# Secrets Store CSI driver to authenticate to Secret Manager.
serviceAccount:
  create: false
  name: ""
  annotations: {}

# Magento configuration
magento:
  host: magento.example.com
  language: en_GB
  currency: GBP
  timezone: Europe/London
  # Deploy mode: developer (static content on-the-fly) or production (pre-compiled)
  mode: developer

# Pre-build Magento static content during pod setup. The chart runs
# `deploy:mode:set ... --skip-compilation`, so without this block
# adminhtml never gets fresh CSS/JS after the initial install.
staticContentDeploy:
  enabled: false               # opt-in, off by default
  areas:                       # frontend gets a separate npm build via
    - frontend                 # Hyva tailwind in many setups, but you
    - adminhtml                # can include both safely.
  locales:
    - en_US
  signing: false               # When true, sets dev/static/sign=1 so
                               # rendered URLs include /version<ts>/...
                               # — required for safe long-cache CDN
                               # rules on /static/*.

# Admin users - first user is primary (used for setup:install)
# All users are synced on every pod restart (idempotent)
# Note: Roles must be assigned via admin panel - CLI doesn't support role assignment
adminUsers:
  - username: admin
    email: admin@example.com
    firstname: Admin
    lastname: User
    password: ""  # Set via --set, or use passwordKey with existingSecret
    passwordKey: admin-password  # Key in secret for this user's password
# Example:
# adminUsers:
#   - username: brtkwr
#     email: bkunwar@two.inc
#     firstname: Bharat
#     lastname: Kunwar
#     passwordKey: admin-password-brtkwr
#   - username: shabib
#     email: shabib@two.inc
#     firstname: Salman
#     lastname: Habib
#     passwordKey: admin-password-shabib

# Lifecycle hooks for injecting scripts at different stages
# All hooks should be idempotent (safe to run multiple times)
hooks:
  # Runs before any setup (both upgrade and install paths)
  preSetup: ""
  # Runs after setup:upgrade on existing installs only
  postUpgrade: ""
  # Runs after setup:install on fresh installs only
  postInstall: ""
  # Runs after all setup completes (both paths) - use for config, stores, etc.
  postSetup: ""
  # Hooks run as root in setup.sh. Use the chart-provided `mage` wrapper
  # for any bin/magento invocation so cache writes land owned by www-data;
  # raw `bin/magento ...` calls bootstrap Magento as root and leave
  # root-owned files in var/cache that later 500 php-fpm requests.
  # (As a safety net the chart trap-runs fix_permissions on exit, but the
  # right convention is still to drop privs at the call site.)
  #
  # Example:
  # hooks:
  #   postUpgrade: |
  #     mage admin:user:create --admin-user=admin ... || true
  #   postSetup: |
  #     mage store:create 'Hyva Checkout' hyva || true
  #     mage config:set payment/two_payment/active 1 || true

# DEPRECATED: Use hooks.postSetup instead
postScript: ""

# Existing secret containing database and admin passwords
# If set, the chart will NOT create its own secret
# Expected keys: database-password, admin-password-0, admin-password-1, etc.
# Optional keys: api-key (injected as MAGENTO_API_KEY env var)
existingSecret: ""

# Extra environment variables to inject into the magento container
# Useful for injecting API keys or other secrets
extraEnv: []
# Example:
# extraEnv:
#   - name: TWO_API_KEY
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: api-key

# Extra volumes and volume mounts for the `magento` runtime container.
#
# Standard Helm pattern for mounting additional volumes (emptyDir, ConfigMap,
# Secret, CSI, etc.) into the magento container without forking the chart.
#
# Mounts are appended to the `magento` runtime container's volumeMounts
# *after* the chart's `data` PVC mount, so paths under /var/www/html/var/
# (which the chart subPath-mounts from the data PVC) can be overlaid with
# an ephemeral volume. Kubelet processes volumeMounts in array order and
# later mounts win for overlapping paths.
#
# Common use case — keep app debug logs off the persistent data PVC so a
# misconfigured logger can't fill it and crash the pod:
#
#   extraVolumes:
#     - name: magento-debug
#       emptyDir:
#         sizeLimit: 500Mi
#   extraVolumeMounts:
#     - name: magento-debug
#       mountPath: /var/www/html/var/debug
#
# emptyDir lives on the node's local ephemeral disk, never grows beyond
# `sizeLimit` (kubelet evicts the pod past the limit), and is wiped on
# pod restart — perfect for transient log paths.
extraVolumes: []
extraVolumeMounts: []

# Database (MariaDB sidecar)
database:
  name: magento
  user: magento
  # password: set via --set or secrets (ignored if existingSecret is set)
  image: mariadb
  tag: "10.6"
  storage: 10Gi

# OpenSearch sidecar
opensearch:
  enabled: true
  image: opensearchproject/opensearch
  tag: "2.19.0"
  storage: 5Gi
  javaOpts: "-Xms512m -Xmx512m"

# Redis sidecar — backs cache.default, cache.page_cache, and session.
# Without this, Magento defaults to filesystem backends with no eviction
# policy, and var/page_cache fills the PVC over time → SessionHandler
# write failures → admin 500s.
#
# Pod-local only. The chart hardcodes the Redis host to 127.0.0.1 in
# the template — there is intentionally no `host` knob and no
# `password` / `tls` support, so this chart cannot point at an
# external managed Redis (Memorystore, ElastiCache, etc.). The sidecar
# model exists to escape filesystem-backed cache; a managed-Redis
# story is a separate piece of design work.
#
# Cache is ephemeral (no persistence). Pod restart = empty cache for
# `cache.default` and `cache.page_cache` (both regenerable), and =
# all-users-logged-out for `session` (acceptable trade-off vs the
# pre-PR filesystem behaviour, which also lost sessions on the same
# PVC that filled up). A `persistence.enabled` knob defaulting to off
# could be added later if session continuity across restarts becomes
# important — sessions would migrate to a small dedicated PVC, leaving
# cache.* ephemeral.
#
# **Existing-deployment caveat.** Flipping `redis.enabled` from false →
# true does NOT clean up the old filesystem backends — Magento simply
# stops writing to them, but `var/page_cache/`, `var/cache/`, and
# `var/session/` keep their existing contents on the PVC forever. The
# very pollution this chart change escapes from persists until you
# manually clear those directories. See README "Switching an existing
# release from filesystem to Redis cache" for the cleanup recipe.
redis:
  enabled: true
  image: redis
  tag: "7.4-alpine"
  port: 6379
  # Eviction. allkeys-lru drops the least-recently-used keys when memory is
  # exhausted. Avoids a wedged pod if the cache hot set ever exceeds maxmemory.
  #
  # 256mb is comfortable for dev/staging where the catalog is small and
  # traffic is low. Production storefronts churn through FPC entries
  # fast (one per URL × customer-group × currency × store-view) and
  # will hit LRU eviction sooner than they should at this size —
  # consider bumping to 1gb+ for prod workloads.
  maxmemory: "256mb"
  maxmemoryPolicy: "allkeys-lru"
  # Magento conventionally splits its three Redis uses across separate DBs
  # so a session flush doesn't blow away the cache (and vice versa).
  databases:
    default: 0
    pageCache: 1
    session: 2
  session:
    # Magento's session-save Redis log level: 0 (debug) … 7 (emergency).
    # 3 = LOG_ERR matches the upstream default for prod. Lift to 1
    # (LOG_ALERT) only when chasing session-handler bugs.
    logLevel: 3
    # Max number of PHP processes that may wait for a lock on a single
    # session in Cm_RedisSession. Cm default is 6, which is too low
    # for Hyva checkout interactions (chip-switch + parallel ajax can
    # fire 6+ concurrent same-session requests and trip
    # "Redis session exceeded concurrent connections"). 20 gives
    # headroom without papering over genuine runaway parallel-request
    # bugs. Per-session, not aggregate — so it does not scale with
    # concurrent users on distinct sessions.
    maxConcurrency: 20

# Persistence
persistence:
  enabled: true
  storageClass: ""
  size: 20Gi

# Ingress
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

# Git-sync sidecars for live plugin development
# Each plugin gets its own git-sync container
gitSync:
  image: registry.k8s.io/git-sync/git-sync:v4.2.1
  # Credentials for private repos (optional)
  # Creates a secret with GitHub token for git-sync to use
  credentials:
    # GitHub personal access token (PAT) with repo read access
    # Can be set via --set gitSync.credentials.token=ghp_xxx
    token: ""
  plugins: []
  # Example:
  # plugins:
  #   - name: my-plugin
  #     repo: https://github.com/your-org/magento-plugin.git
  #     branch: main
  #     path: app/code/YourVendor/Module
  #     private: false  # set to true for private repos (uses credentials.token)
  #     # Optional subpath within the repo to materialise into the symlink
  #     # target. Useful when a single repo holds multiple modules at
  #     # different roots (e.g. a monorepo with `plugin/` and `hyva/` at the
  #     # top level). Omit or leave empty to materialise from the repo root.
  #     # sourcePath: plugin

  # Auto-reload Magento when git-sync pulls a new SHA on any plugin branch.
  # On every change detection, the watcher runs a mode-appropriate reload:
  #   * production  -> bin/magento setup:static-content:deploy <locales>
  #   * developer   -> rm -rf <developerClearPaths> (regenerated lazily)
  # then bin/magento cache:flush + apachectl -k graceful.
  # Disable entirely if you want plugin pushes to take effect only on pod
  # restart (e.g. in real production deployments where git-sync is unused).
  reload:
    enabled: true
    # When true, run setup:upgrade + setup:di:compile on every rotation.
    # Required for plugin pushes that change the DI graph (new constructor
    # deps, new di.xml preferences) or DB schema (db_schema.xml). Adds
    # ~30-60s of in-pod work per rotation. Default false to preserve the
    # current fast-reload behaviour for consumers that only push template
    # or static content.
    compile: false
    # Sleep before the watcher's first poll, after setup.sh forks it.
    # Gives setup.sh time to finish its own final cache:flush / apachectl.
    initialDelaySeconds: 30
    # Poll interval for symlink-target change detection.
    # git-sync sidecar polls upstream every 60s by default, so anything
    # under 60s is wasted CPU; anything much over 60s adds rollout lag.
    pollIntervalSeconds: 30
    # Paths cleared in developer mode on git-sync change. Each path is
    # rm -rf'd; trailing /* clears contents but keeps the parent dir.
    developerClearPaths:
      - /var/www/html/generated/code
      - /var/www/html/generated/metadata
      - /var/www/html/pub/static/frontend/*
      - /var/www/html/pub/static/_cache
      - /var/www/html/var/view_preprocessed
      - /var/www/html/var/cache/*

# Resources
resources:
  magento:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  database:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  opensearch:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  redis:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"

# Health checks
healthCheck:
  # Increased to allow init-setup container to complete before main container health check
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Service
service:
  type: ClusterIP
  port: 80

# Pod settings
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
