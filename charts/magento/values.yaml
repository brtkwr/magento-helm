# Magento Helm Chart Values
# https://github.com/brtkwr/magento-helm

image:
  repository: ghcr.io/brtkwr/magento
  tag: "2.4.8"
  pullPolicy: IfNotPresent

# Magento configuration
magento:
  host: magento.example.com
  language: en_GB
  currency: GBP
  timezone: Europe/London
  # Deploy mode: developer (static content on-the-fly) or production (pre-compiled)
  mode: developer

# In production mode the chart runs `bin/magento setup:static-content:deploy`
# at the end of setup.sh and on every git-sync plugin SHA flip, so static
# assets are materialised as real files for the listed locales. Ignored when
# magento.mode is `developer` (assets generated lazily on first request).
staticContentDeploy:
  locales:
    - en_GB

# Admin users - first user is primary (used for setup:install)
# All users are synced on every pod restart (idempotent)
# Note: Roles must be assigned via admin panel - CLI doesn't support role assignment
adminUsers:
  - username: admin
    email: admin@example.com
    firstname: Admin
    lastname: User
    password: ""  # Set via --set, or use passwordKey with existingSecret
    passwordKey: admin-password  # Key in secret for this user's password
# Example:
# adminUsers:
#   - username: brtkwr
#     email: bkunwar@two.inc
#     firstname: Bharat
#     lastname: Kunwar
#     passwordKey: admin-password-brtkwr
#   - username: shabib
#     email: shabib@two.inc
#     firstname: Salman
#     lastname: Habib
#     passwordKey: admin-password-shabib

# Lifecycle hooks for injecting scripts at different stages
# All hooks should be idempotent (safe to run multiple times)
hooks:
  # Runs before any setup (both upgrade and install paths)
  preSetup: ""
  # Runs after setup:upgrade on existing installs only
  postUpgrade: ""
  # Runs after setup:install on fresh installs only
  postInstall: ""
  # Runs after all setup completes (both paths) - use for config, stores, etc.
  postSetup: ""
  # Example:
  # hooks:
  #   postUpgrade: |
  #     bin/magento admin:user:create --admin-user=admin ... || true
  #   postSetup: |
  #     bin/magento store:create 'Hyva Checkout' hyva || true
  #     bin/magento config:set payment/two_payment/active 1 || true

# DEPRECATED: Use hooks.postSetup instead
postScript: ""

# Existing secret containing database and admin passwords
# If set, the chart will NOT create its own secret
# Expected keys: database-password, admin-password-0, admin-password-1, etc.
# Optional keys: api-key (injected as MAGENTO_API_KEY env var)
existingSecret: ""

# Extra environment variables to inject into the magento container
# Useful for injecting API keys or other secrets
extraEnv: []
# Example:
# extraEnv:
#   - name: TWO_API_KEY
#     valueFrom:
#       secretKeyRef:
#         name: my-secret
#         key: api-key

# Database (MariaDB sidecar)
database:
  name: magento
  user: magento
  # password: set via --set or secrets (ignored if existingSecret is set)
  image: mariadb
  tag: "10.6"
  storage: 10Gi

# OpenSearch sidecar
opensearch:
  enabled: true
  image: opensearchproject/opensearch
  tag: "2.19.0"
  storage: 5Gi
  javaOpts: "-Xms512m -Xmx512m"

# Persistence
persistence:
  enabled: true
  storageClass: ""
  size: 20Gi

# Ingress
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    secretName: ""

# Git-sync sidecars for live plugin development
# Each plugin gets its own git-sync container
gitSync:
  image: registry.k8s.io/git-sync/git-sync:v4.2.1
  # Credentials for private repos (optional)
  # Creates a secret with GitHub token for git-sync to use
  credentials:
    # GitHub personal access token (PAT) with repo read access
    # Can be set via --set gitSync.credentials.token=ghp_xxx
    token: ""
  plugins: []
  # Example:
  # plugins:
  #   - name: my-plugin
  #     repo: https://github.com/your-org/magento-plugin.git
  #     branch: main
  #     path: app/code/YourVendor/Module
  #     private: false  # set to true for private repos (uses credentials.token)

  # Auto-reload Magento when git-sync pulls a new SHA on any plugin branch.
  # On every change detection, the watcher runs a mode-appropriate reload:
  #   * production  -> bin/magento setup:static-content:deploy <locales>
  #   * developer   -> rm -rf <developerClearPaths> (regenerated lazily)
  # then bin/magento cache:flush + apachectl -k graceful.
  # Disable entirely if you want plugin pushes to take effect only on pod
  # restart (e.g. in real production deployments where git-sync is unused).
  reload:
    enabled: true
    # Sleep before the watcher's first poll, after setup.sh forks it.
    # Gives setup.sh time to finish its own final cache:flush / apachectl.
    initialDelaySeconds: 30
    # Poll interval for symlink-target change detection.
    # git-sync sidecar polls upstream every 60s by default, so anything
    # under 60s is wasted CPU; anything much over 60s adds rollout lag.
    pollIntervalSeconds: 30
    # Paths cleared in developer mode on git-sync change. Each path is
    # rm -rf'd; trailing /* clears contents but keeps the parent dir.
    developerClearPaths:
      - /var/www/html/generated/code
      - /var/www/html/generated/metadata
      - /var/www/html/pub/static/frontend/*
      - /var/www/html/pub/static/_cache
      - /var/www/html/var/view_preprocessed
      - /var/www/html/var/cache/*

# Resources
resources:
  magento:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  database:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  opensearch:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Health checks
healthCheck:
  # Increased to allow init-setup container to complete before main container health check
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Service
service:
  type: ClusterIP
  port: 80

# Pod settings
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
