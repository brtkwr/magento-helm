name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
            chart:
              - 'charts/**'

  lint-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chart == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Lint chart
        run: helm lint charts/magento

      - name: Template chart
        run: helm template magento charts/magento --debug

      - name: Test liveness probe logic
        run: ./charts/magento/tests/liveness-probe.test.sh

  lint-docker:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile.base
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.base
          failure-threshold: error

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

  docker-base:
    name: Build Base Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [changes, lint-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magento-base
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile.base
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=base-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=base-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-base-merge:
    name: Merge Base Manifest
    runs-on: ubuntu-latest
    needs: [docker-base]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magento-base
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-base-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          short=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          docker buildx imagetools create \
            -t "$IMAGE:php8.2" \
            -t "$IMAGE:php8.2-$short" \
            $(printf "$IMAGE@sha256:%s " *)

  docker-magento:
    name: Build Magento ${{ matrix.version }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [docker-base-merge]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magento
    strategy:
      fail-fast: false
      matrix:
        version: ["2.4.7", "2.4.8"]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Magento image by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            MAGENTO_VERSION=${{ matrix.version }}
            PHP_VERSION=8.2
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          secrets: |
            composer_auth={"http-basic":{"repo.magento.com":{"username":"${{ secrets.MAGENTO_PUBLIC_KEY }}","password":"${{ secrets.MAGENTO_PRIVATE_KEY }}"}}}
          cache-from: type=gha,scope=magento-${{ matrix.version }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=magento-${{ matrix.version }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-magento-${{ matrix.version }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-magento-merge:
    name: Merge Magento ${{ matrix.version }} Manifest
    runs-on: ubuntu-latest
    needs: [docker-magento]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/magento
    strategy:
      fail-fast: false
      matrix:
        version: ["2.4.7", "2.4.8"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-magento-${{ matrix.version }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          short=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          docker buildx imagetools create \
            -t "$IMAGE:${{ matrix.version }}" \
            -t "$IMAGE:${{ matrix.version }}-$short" \
            $(printf "$IMAGE@sha256:%s " *)

  helm-publish:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [changes, lint-chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.chart == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Bump version and push tag
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          app_version=$(yq '.image.tag' charts/magento/values.yaml)
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.new_version }}/" charts/magento/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${app_version}\"/" charts/magento/Chart.yaml
          helm package charts/magento
          helm push magento-${{ steps.version.outputs.new_version }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
